# An event posted by an outside system, landing in DHIS2 the moment it is captured.
#
# The other examples on this shelf poll or wait. This one is pushed: a mobile capture app,
# an EMR, a lab middleware POSTs one encounter to this pipeline's endpoint and the run starts
# with that request as its source's output. Nothing is scheduled and nothing is scanned.
#
# WHERE THIS LANDS, AND WHY IT IS NOT A TRACKER EVENT. An event-shaped capture is what
# arrives, but `dhis2.tracker` in this pack READS `/api/tracker` -- tracked entities,
# enrollments, events -- and has no write side, so there is nothing to hand an event to
# today. The encounter is therefore summed into the aggregate figures it contributes to and
# imported as a data value set, which is what an aggregate DHIS2 wants from an event stream
# anyway. When a tracker write block lands, only the reshape and the import change; the
# intake, the pick, the mapping table and the guard do not.
#
# The hops, and the shape at each one:
#
#   1. the POST     -> {encounter: {facility, occurred_at, items: [{code, quantity}]}}
#   2. pick         -> {facility, occurred_at, items}, three paths into that body and
#                      nothing else
#   3. reshape      -> {dataValues: [{dataElement, period, orgUnit, value}]}, one value per
#                      distinct item code, quantities summed
#   4. gate         -> the same, refused unless the ids and the period are DHIS2's own
#   5. import       -> the instance's summary
#
# THE PICK IS THE WHOLE SECURITY BOUNDARY. The whole body is the source's output, but only
# `pick` reads it, and it hands on exactly three named fields, each checked for its type. A
# payload carrying a connection code, a dry_run: false, or a field nobody asked for reaches
# no later step, because no path names it; `dry_run` is a parameter, the pipeline's own to
# decide, and no call can choose it.
#
# The period is derived rather than accepted. A capture knows when it happened; it does not
# get to say which DHIS2 month it belongs to, because that is the receiving instance's
# vocabulary and a caller that gets it wrong would silently write into the wrong month.
#
# RUN IT BY HAND, here, with no server. No --input takes the source's sample:
#
#   dg run --local examples/inbound/endpoint-payload-to-tracker-event.yaml
#   dg run --local examples/inbound/endpoint-payload-to-tracker-event.yaml --input '{body: {
#     encounter: {facility: DiszpKrYNg8, occurred_at: "2026-06-14T09:20:00Z",
#     items: [{code: NVP_WITHIN_72H, quantity: 3}]}}}'
#
# ON A SERVER, apply it, keep the token the apply printed, and post an encounter:
#
#   dg apply examples/inbound/endpoint-payload-to-tracker-event.yaml
#   dg source call endpoint-payload-to-tracker-event posted --source-token "$TOKEN" --body '{
#     "encounter": {"facility": "DiszpKrYNg8", "occurred_at": "2026-06-14T09:20:00Z",
#     "items": [{"code": "EXPOSED_REGISTERED", "quantity": 2}]}}'
#   curl -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
#     --data @encounter.json http://localhost:3333/endpoints/captures
#   dg source inputs endpoint-payload-to-tracker-event posted
#
# The token lives on the instance and is shown once; `dg source rotate-token` mints another.
#
# EXPECT THIS RUN TO SUCCEED with network access to the play server, the import a dry run.

format: dirigent/v1
kind: pipeline
code: endpoint-payload-to-tracker-event
name: A pushed encounter into DHIS2
description: |
  An outside system POSTs one captured encounter to an endpoint source; a jq step picks the
  named fields, and the run reshapes them into a DHIS2 data value set and imports it.

  The pack's `dhis2.tracker` block reads `/api/tracker` and does not write it, so an
  event-shaped capture lands as the aggregate figures it contributes to.

tags: [inbound, dhis2, sources, transform, validate, cross-boundary]

requires:
  blocks:
    - transform.jq
    - validate.schema
    - dhis2.data_value_set_import

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.dhis2.org/2.43
      basic_username: admin
      basic_password: district
      timeout: 60s

params:
  type: object
  properties:
    dry_run:
      type: boolean
      description: Whether the instance validates the import and writes nothing.
      default: true

schemas:
  data-value-set:
    type: object
    required: [dataValues]
    properties:
      dataValues:
        type: array
        minItems: 1
        items:
          type: object
          required: [dataElement, period, orgUnit, value]
          properties:
            dataElement: { type: string, format: dhis2-uid }
            period: { type: string, format: dhis2-period }
            orgUnit: { type: string, format: dhis2-uid }
            value: { type: string }

steps:
  posted:
    source:
      kind: endpoint
      path: /captures
      methods: [POST]
      accepts: [application/json]
      max_body: 64KB
    sample:
      body:
        encounter:
          facility: DiszpKrYNg8
          occurred_at: "2026-06-14T09:20:00Z"
          items:
            - { code: EXPOSED_REGISTERED, quantity: 2 }
            - { code: NVP_WITHIN_72H, quantity: 1 }
            - { code: EXPOSED_REGISTERED, quantity: 1 }

  # Three paths into the body, each one typed; anything else the caller sent stops here.
  pick:
    block: transform.jq
    depends_on: [posted]
    config:
      input: "${steps.posted.output.body}"
      program: |
        .encounter as $e
        | if ($e | type) != "object" then error("the body carries no encounter object")
          elif ($e.facility | type) != "string" then error("encounter.facility must be a string")
          elif ($e.occurred_at | type) != "string" then error("encounter.occurred_at must be a string")
          elif ($e.items | type) != "array"
            or ([$e.items[] | select((.code | type) != "string"
                                     or (.quantity | type) != "number"
                                     or .quantity != (.quantity | floor))] | length) > 0
          then error("encounter.items must be a list of {code: string, quantity: integer}")
          else {facility: $e.facility,
                occurred_at: $e.occurred_at,
                items: [$e.items[] | {code, quantity}]}
          end

  # One encounter can carry the same item twice -- two children registered in one visit --
  # so the items are grouped and summed before they become data values. Importing them as
  # two values would have the second silently replace the first rather than add to it.
  reshape:
    block: transform.jq
    depends_on: [pick]
    config:
      input:
        facility: "${steps.pick.output.value.facility}"
        occurred_at: "${steps.pick.output.value.occurred_at}"
        items: "${steps.pick.output.value.items}"
        lookup:
          EXPOSED_REGISTERED: x0PshcPLSk1
          NVP_WITHIN_72H: wZqi8EXN5x4
      program: |
        .lookup as $lookup
        | .facility as $ou
        # A monthly DHIS2 period is YYYYMM, which is the first seven characters of an ISO
        # instant with the dash taken out. The capture's own clock decides the month.
        | (.occurred_at[0:7] | gsub("-"; "")) as $period
        | {dataValues: [
            .items
            | group_by(.code)[]
            | {dataElement: $lookup[.[0].code],
               period: $period,
               orgUnit: $ou,
               value: ([.[].quantity] | add | tostring)}
          ]}

  # An item code the table does not know left dataElement null, and null is not a uid: the
  # gate is what turns a sender's typo into a failed run instead of a refused import.
  gate:
    block: validate.schema
    depends_on: [reshape]
    config:
      input: "${steps.reshape.output.value}"
      schema: data-value-set

  import:
    block: dhis2.data_value_set_import
    depends_on: [gate]
    config:
      connection: dhis2-demo
      data_values: "${steps.gate.output.value}"
      dry_run: "${params.dry_run}"
