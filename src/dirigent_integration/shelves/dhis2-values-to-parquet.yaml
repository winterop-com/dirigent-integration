# Export a DHIS2 data value set and re-encode it as parquet in object storage.
#
# Three packs meet in this one pipeline, which is why it lives here and in no pack: the read
# is dhis2.data_value_set_export from the dhis2 pack, the re-encode is convert.arrow from the
# parquet pack, and both ends address the s3:// scheme the dirigent-storage-s3 pack contributes.
#
# Three hops, and what each one hands on:
#
#   export      dhis2.data_value_set_export. The set comes back as `body`, a value in the run.
#   stage       storage.write, that value as one JSON object. A converter reads a URI, so a
#               value the run is holding is put down before it is re-encoded.
#   to_parquet  convert.arrow, json to parquet. Parquet is bytes and never travels as a value:
#               the step names a source URI and a target URI and carries nothing between them.
#               Output: source, target, bytes_written.
#
# Which connection backs s3:// is an instance setting (storage_connections: {s3: <code>}).
#
#   dg run --local examples/dhis2-values-to-parquet.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-values-to-parquet
name: Export a data value set as parquet
description: Read a DHIS2 data value set into object storage, then re-encode it as parquet beside it.

tags: [dhis2, parquet, s3, cross-boundary]

requires:
  blocks:
    - dhis2.data_value_set_export
    - storage.write
    - convert.arrow

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 60s

steps:
  export:
    block: dhis2.data_value_set_export
    config:
      connection: dhis2-demo
      data_set: BfMAe6Itzgt
      period: "202507"
      org_unit: vSbt6cezomG
  stage:
    block: storage.write
    depends_on: [export]
    config:
      target: s3://dirigent-exports/dhis2/BfMAe6Itzgt-202507.json
      value: ${steps.export.output.body}
  to_parquet:
    block: convert.arrow
    depends_on: [stage]
    config:
      source: ${steps.stage.output.uri}
      from: json
      to: parquet
      target: s3://dirigent-exports/dhis2/BfMAe6Itzgt-202507.parquet
