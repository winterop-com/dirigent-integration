# A FHIR Subscription notification delivered to an endpoint source, translated, and imported.
#
# THE FLOW, END TO END. A FHIR server holds a Subscription that watches for new captures. When
# one arrives it POSTs a notification to this pipeline's endpoint; the request becomes the
# source's output, `unwrap` picks the notified resource out of its body, the document translates
# it into a data value set, and the import runs as a dry run.
#
# THE SUBSCRIPTION CONTRACT, WHICH IS THE POINT OF THIS FILE. A FHIR Subscription is a standing
# request: "when a resource matching this search appears, tell me here". Three fields carry it.
#
#   criteria      a search string, exactly as it would be typed against the server, e.g.
#                 "QuestionnaireResponse?questionnaire=http://example.org/fhir/Questionnaire/lyLU2wR22tC"
#   channel.type  how to be told. `rest-hook` is an HTTP POST, which is what a dirigent
#                 endpoint source takes; the others are websocket, email, and message.
#   channel.endpoint  where to POST it -- this source's route on the instance,
#                 `$DG_URL/endpoints/fhir/notifications`.
#
# HOW THE SERVER PRESENTS THE TOKEN. A rest-hook subscription can carry fixed headers that the
# server sends with every notification: `channel.header` in R4, a `parameter` named for the
# header in R5. Set one to `Authorization: Bearer <token>`, with the token the apply printed,
# and every delivery authenticates as this source. A server that cannot send headers cannot
# reach it, which is the point: the endpoint takes no anonymous POST.
#
# What arrives in that POST depends on `channel.payload`, and the three choices are a real
# decision rather than a formality:
#
#   absent          a PING. An empty body: "something matched, come and look". The pipeline
#                   then has to search the server itself, which is more work and is also the
#                   only choice that never puts patient data in a request body.
#   id-only         the notification names the resource; the pipeline reads it back.
#   full-resource   the resource rides in the notification. One request, no read-back, and
#                   the delivery is now carrying clinical data -- so it is signed, and the
#                   endpoint is not on the public internet.
#
# This document takes full-resource, because it is the shape that shows the whole translation
# in one file. In R4 that body is the bare resource; R5 and the R4 backport wrap it in a
# history Bundle whose first entry is a SubscriptionStatus and whose second is the resource,
# which is the shape mapped below and the one most servers now send.
#
# `d2w fhir serve` HAS NO SUBSCRIPTION. Its capture surface is `POST /QuestionnaireResponse`
# and its notification surface is the receipt spool -- `GET /facade/spool`, whose lifecycle
# moves received -> forwarded or rejected. A pipeline pulls that spool on a schedule instead
# (fhir-nightly-window-sync.yaml is that shape). This document is for the FHIR server that DOES
# support Subscription, which is most of them, and it is written so the same translation serves
# either way.
#
# WHAT ARRIVES. The notification body:
#
#   {"resourceType": "Bundle", "type": "history",
#    "entry": [
#      {"resource": {"resourceType": "SubscriptionStatus", "type": "event-notification",
#                    "eventsSinceSubscriptionStart": "17"}},
#      {"resource": {"resourceType": "QuestionnaireResponse", "status": "completed",
#                    "questionnaire": ".../Questionnaire/lyLU2wR22tC",
#                    "subject": {"reference": "Location/dczh6Jfd4no"},
#                    "extension": [{"url": ".../d2-period",
#                                   "extension": [{"url": "iso", "valueString": "202608"}]}],
#                    "item": [...]}}]}
#
# WHAT LEAVES. The `/api/dataValueSets` envelope, same as every inbound document here:
#
#   {"dataSet": "lyLU2wR22tC", "period": "202608", "orgUnit": "dczh6Jfd4no",
#    "dataValues": [{"dataElement": "GMd99K8gVut",
#                    "categoryOptionCombo": "qNCMOhkoQju", "value": "426.3"}]}
#
# WHERE A READER CHANGES IT. The `unwrap` step, and nothing else. It is STRICT: it names two
# paths into the body, a body that does not have them fails the run before anything is
# translated, and nothing else the caller POSTs reaches a later step, because no later step
# reads the body. A server sending the bare R4 resource rather than a Bundle changes `capture`
# to the body itself, and the counter, which a bare resource does not carry, to null.
#
# WHAT LIVES ON THE INSTANCE AND NOT IN GIT. The source's token, whether it is paused, and
# every input it has taken. The apply shows the token exactly once, and
# `dg source rotate-token` mints another, which the Subscription's header then has to carry.
#
# RUN IT BY HAND, here, with no server. No --input takes the source's sample, a whole
# notification Bundle:
#
#   dg run --local examples/fhir/fhir-subscription-to-dhis2.yaml
#
# ON A SERVER, apply it, keep the token the apply printed, and deliver a notification the way
# the FHIR server would:
#
#   dg apply examples/fhir/fhir-subscription-to-dhis2.yaml
#   dg source call fhir-subscription-to-dhis2 notified --source-token "$TOKEN" --body @notification.json
#   curl -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/fhir+json' \
#     --data @notification.json "$DG_URL/endpoints/fhir/notifications"
#   dg source inputs fhir-subscription-to-dhis2 notified
#
# EXPECT THIS RUN TO SUCCEED with network access to the play server, the import a dry run.

format: dirigent/v1
kind: pipeline
code: fhir-subscription-to-dhis2
name: A FHIR Subscription notification imported
description: |
  Receive a FHIR notification and rehearse importing it into DHIS2.

  A FHIR `Subscription` rest-hook notification arrives on an endpoint source, and the notified
  `QuestionnaireResponse` is translated into a DHIS2 data value set before the import is
  rehearsed.

  The subscription contract is three fields: `criteria` (a search string), `channel.type`
  (`rest-hook` is an HTTP POST), and `channel.endpoint` (the source's route). The server
  presents the source's token as a fixed `Authorization` header on the subscription.
  `channel.payload` decides whether the delivery is a ping, an id, or the resource itself --
  this takes the resource, wrapped in the history `Bundle` R5 and the R4 backport send.

tags: [fhir, dhis2, sources, transform, jq, cross-boundary]

requires:
  blocks:
    - transform.jq
    - dhis2.data_value_set_import

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.dhis2.org/2.43
      basic_username: admin
      basic_password: district
      timeout: 60s

steps:
  notified:
    source:
      kind: endpoint
      path: /fhir/notifications
      methods: [POST]
      accepts: [application/fhir+json, application/json]
      max_body: 1MB
    # What a delivery carries: the history Bundle, a SubscriptionStatus and then the resource.
    sample:
      content_type: application/fhir+json
      body:
        resourceType: Bundle
        type: history
        entry:
          - resource:
              resourceType: SubscriptionStatus
              type: event-notification
              eventsSinceSubscriptionStart: "17"
          - resource:
              resourceType: QuestionnaireResponse
              status: completed
              authored: "2026-08-31T09:00:00Z"
              questionnaire: http://example.org/fhir/Questionnaire/lyLU2wR22tC
              subject:
                reference: Location/dczh6Jfd4no
              extension:
                - url: http://example.org/fhir/StructureDefinition/d2-period
                  extension:
                    - url: iso
                      valueString: "202608"
                    - url: type
                      valueCode: Monthly
                - url: http://example.org/fhir/StructureDefinition/d2-attribute-option-combo
                  valueCoding:
                    code: N7QFN41eTN8
              item:
                - linkId: GMd99K8gVut
                  item:
                    - linkId: GMd99K8gVut.qNCMOhkoQju
                      answer:
                        - valueDecimal: 426.3
                    - linkId: GMd99K8gVut.LbeIlyHEhKr
                      answer:
                        - valueDecimal: 628.2
                - linkId: wfKKFhBn0Q0
                  answer:
                    - valueDecimal: 142.1

  # The whole declaration of what a delivery may carry. `capture` is the history Bundle's second
  # entry -- the first is the SubscriptionStatus -- and the counter comes off that status. A gap
  # between two deliveries' counters means a notification was lost, which is the only way this
  # channel says so.
  unwrap:
    block: transform.jq
    depends_on: [notified]
    config:
      input: "${steps.notified.output.body}"
      program: |
        if .resourceType != "Bundle" then error("the notification is not a Bundle")
        elif (.entry[1].resource.resourceType // null) != "QuestionnaireResponse"
        then error("the notification's second entry is not a QuestionnaireResponse")
        elif (.entry[0].resource.eventsSinceSubscriptionStart | type) != "string"
        then error("the notification carries no SubscriptionStatus counter")
        else {capture: .entry[1].resource,
              events_since_start: .entry[0].resource.eventsSinceSubscriptionStart}
        end

  # Only a completed response is translated. An in-progress one is a form still being filled,
  # and a notification is allowed to fire on it -- `criteria` matches a resource, not a state.
  translate:
    block: transform.jq
    depends_on: [unwrap]
    config:
      input: "${steps.unwrap.output.value.capture}"
      program: |
        if .status != "completed" then
          error("the notified response is \(.status), not completed; nothing to import")
        else . end
        | . as $r
        | {dataSet: ($r.questionnaire | split("/") | last),
           period: ([$r.extension[] | select(.url | endswith("/d2-period")).extension[]
                     | select(.url == "iso").valueString][0]),
           orgUnit: ($r.subject.reference | ltrimstr("Location/")),
           attributeOptionCombo: (
             [$r.extension[] | select(.url | endswith("/d2-attribute-option-combo"))][0]
             | .valueCoding.code),
           dataValues: [
             $r.item[] | recurse(.item[]?)
             | select((.answer // []) | length > 0)
             | (.linkId | split(".")) as $key
             | (.answer[0] | (.valueDecimal // .valueInteger // .valueString // .valueBoolean)) as $v
             | {dataElement: $key[0], value: ($v | tostring)}
               + (if ($key | length) > 1 then {categoryOptionCombo: $key[1]} else {} end)]}
        | del(.attributeOptionCombo | select(. == null))

  # A notification arrives once and is not replayed, so the import's retry budget is what
  # stands between a momentary DHIS2 and a lost capture. dry_run makes this a rehearsal;
  # dropping it is the whole difference between this document and a live forwarder.
  rehearse:
    block: dhis2.data_value_set_import
    depends_on: [translate]
    retry:
      # The budget counts the first try, so this is one attempt and two retries.
      max_attempts: 3
      backoff: 5s
    config:
      connection: dhis2-demo
      data_values: "${steps.translate.output.value}"
      dry_run: true
      atomic_mode: ALL

  receipt:
    block: transform.jq
    depends_on: [rehearse]
    config:
      input:
        summary: "${steps.rehearse.output}"
        events_since_start: "${steps.unwrap.output.value.events_since_start}"
        document: "${steps.translate.output.value}"
      program: |
        {notification: .events_since_start,
         data_set: .document.dataSet,
         period: .document.period,
         org_unit: .document.orgUnit,
         status: .summary.status,
         would_import: .summary.imported,
         conflicts: (.summary.conflicts | length)}
