# One export per organisation unit, flattened into one parquet table, with a manifest.
#
# The single-org-unit version of this is dhis2-values-to-parquet.yaml beside it. This is the
# shape a real extraction has: a list of facilities or districts, one read each, one table at
# the end, and something that says what actually landed. It spans three packs -- dhis2 for the
# reads, parquet for the encoding, storage-s3 for both destinations -- so it belongs to none of
# them and is authored here.
#
# WHY ONE TABLE AND NOT ONE FILE PER ORG UNIT. A value moves through step outputs, and a value
# leaves a run through storage.write; a block does not write storage itself. A fan-out step
# stores one output -- the list of its items' outputs, in item order, with a failed item absent
# from it -- and `for_each` is expanded when the run is created, so it can read params, run and
# item and never an upstream step's output. Item three of one step therefore cannot ask item
# three of another what it produced: a second fan cannot pick up the export its twin made. So
# the fan-in is a single step over every export, and the org unit is read out of each data
# value where the join key can be seen, rather than out of a storage path that used to carry it.
#
# What happens, hop by hop:
#
#   export      one dhis2.data_value_set_export per org unit. Each item answers `body`, the
#               data value set as a value. items: continue means one facility going quiet --
#               a credential that cannot read it, an instance that times out on one subtree --
#               does not cost the others their export; the run ends completed_with_errors and
#               the failed item is simply absent from this step's output list.
#   rows        the fan-in: every set this step is handed, opened at .dataValues and flattened
#               into one table sorted by org unit and data element.
#   staged      storage.write, that table as one json object. A converter reads one URI and
#               writes another, so a value the run is holding is put down before it is
#               re-encoded. Output: uri, bytes_written, content_type.
#   parquet     convert.arrow, json to parquet. Parquet is bytes and never travels as a value:
#               the step names a source URI and a target URI and carries nothing between them.
#               Output: source, target, bytes_written.
#   manifest    what the run has to say for itself: how many org units were asked for, how many
#               answered, how many rows landed, and where the file is.
#   index       that manifest written beside the parquet, at a stable URI. This is the artifact
#               a downstream reader opens first to learn what a run produced without listing a
#               bucket.
#   archive     a second, dated copy of the manifest, so the history of what each run landed
#               survives the next run overwriting the current one.
#
# To make it yours: change org_units, data_set and period, and point bucket at a bucket you
# own. Which connection backs the s3:// scheme is an instance setting
# (storage_connections: {s3: <code>}), so nothing about S3 appears in this document beyond
# the URIs. The dhis2 connection below is the public play server, carried inline so the
# document runs standalone; an instance you own names its own connection instead.
#
#   dg run --local examples/dhis2-values-per-org-unit-to-parquet.yaml
#   dg run --local examples/dhis2-values-per-org-unit-to-parquet.yaml -p period=202506

format: dirigent/v1
kind: pipeline
code: dhis2-values-per-org-unit-to-parquet
name: A parquet table over a batch of org units
description: Export a data value set per organisation unit, flatten the batch into one parquet table, and manifest what landed.

tags: [dhis2, parquet, s3, cross-boundary]

requires:
  blocks:
    - dhis2.data_value_set_export
    - transform.jq
    - storage.write
    - convert.arrow
    - storage.copy

# The public DHIS2 play server, carried inline so this document runs on its own. A server
# apply is where a connection is named rather than carried.
connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 60s

params:
  type: object
  properties:
    org_units:
      type: array
      # Facilities and districts that exist on the play server. The list is the fan-out's
      # width: four elements here are four run items and four reads.
      default: [vSbt6cezomG, DiszpKrYNg8, O6uvpzGd5pu, ImspTQPwCqd]
      items:
        type: string
    data_set:
      type: string
      default: BfMAe6Itzgt
    period:
      type: string
      default: "202507"
      description: An ISO period identifier, such as 202507 or 2026Q1.
    bucket:
      type: string
      default: dirigent-exports

steps:
  export:
    block: dhis2.data_value_set_export
    for_each: ${params.org_units}
    items: continue
    config:
      connection: dhis2-demo
      data_set: ${params.data_set}
      period: ${params.period}
      org_unit: ${item}

  rows:
    block: transform.jq
    depends_on: [export]
    config:
      # One fan-out step, one output: the list of what its items answered. An org unit whose
      # item failed is simply not in it, and an org unit with nothing reported answers a set
      # with no dataValues, which is why the flattening tolerates both.
      input: ${steps.export.output}
      program: |
        [.[]
         | .body
         | (.dataValues // [])[]
         | {org_unit: .orgUnit,
            data_element: .dataElement,
            category_option_combo: .categoryOptionCombo,
            period: .period,
            value: .value,
            stored_by: .storedBy,
            last_updated: .lastUpdated}]
        | sort_by(.org_unit, .data_element, .category_option_combo)

  staged:
    block: storage.write
    depends_on: [rows]
    config:
      target: s3://${params.bucket}/dhis2/${params.data_set}/${params.period}/values.json
      value: ${steps.rows.output.value}

  parquet:
    block: convert.arrow
    depends_on: [staged]
    config:
      source: ${steps.staged.output.uri}
      from: json
      to: parquet
      target: s3://${params.bucket}/dhis2/${params.data_set}/${params.period}/values.parquet

  manifest:
    block: transform.jq
    depends_on: [export, rows, parquet]
    config:
      # `answered` is shorter than `asked_for` exactly when an item failed, which is the only
      # place in the run where that difference is visible as data rather than as a status.
      input:
        data_set: ${params.data_set}
        period: ${params.period}
        asked_for: ${params.org_units}
        answered: ${steps.export.output}
        rows: ${steps.rows.output.value}
        file: ${steps.parquet.output.target}
        bytes: ${steps.parquet.output.bytes_written}
      program: |
        {
          data_set,
          period,
          file,
          bytes,
          asked_for: (.asked_for | length),
          answered: (.answered | length),
          rows: (.rows | length),
          org_units: ([.rows[].org_unit] | unique)
        }

  index:
    block: storage.write
    depends_on: [manifest]
    config:
      target: s3://${params.bucket}/dhis2/${params.data_set}/${params.period}/_manifest.json
      value: ${steps.manifest.output.value}

  archive:
    block: storage.copy
    depends_on: [index]
    config:
      source: ${steps.index.output.uri}
      # Keyed by the run, so today's manifest does not overwrite yesterday's. The current
      # manifest above stays at a stable URI for anything that just wants the latest.
      target: s3://dirigent-archive/dhis2/${params.data_set}/${params.period}/${run.id}.json
