# An analytics query turned into a csv somebody can open, and a webhook saying it is there.
#
# DHIS2 answers /api/analytics with a grid: a `headers` list naming the columns, a `rows` list
# of positional arrays, and a `metaData` block holding the display names for every uid that
# appears. That is a good wire format and a poor report -- nothing outside DHIS2 knows that
# column 2 is the value -- so the middle of this pipeline is the reshaping, and it is the part
# worth reading. Three packs meet here: dhis2 for the query, builtin for the jq, the csv codec
# and the webhook, storage-s3 for where the report lands.
#
# What happens, hop by hop:
#
#   query     dhis2.analytics_query, aggregate mode, broken down by indicator and period with
#             the org unit fixed as a filter. The grid comes back as `body`, a value.
#   rows      the grid becomes a list of flat objects, one per grid row, with the uids
#             resolved to names out of metaData: {indicator, period, value}. That is the
#             shape a csv has, and the grid is not.
#   staged    storage.write, that value as one json object. A converter reads one URI and
#             writes another, so a value the run is holding is put down before it is
#             re-encoded -- and that write is the only door a value leaves a run by.
#   report    convert.std json -> csv, reading the staged object and writing to s3://. The
#             header line is the object keys. Output: source, target, bytes_written.
#   summary   how many rows and where they went, built before the notification so the webhook
#             body is a value and not four references.
#   notify    webhook.post of that summary to whatever URL the caller named. Nothing is signed
#             here; use sign_with when the receiver verifies an HMAC.
#
# To make it yours: point indicators at your own uids (semicolons separate them, which is
# DHIS2's own syntax for several items on one dimension), change period to a fixed period or
# another relative one, and give notify_url a receiver. The default is Postman Echo, which
# reflects what it is posted, so the run shows the body that went out without a receiver of
# your own. Which connection backs s3:// is an instance setting (storage_connections:
# {s3: <code>}).
#
#   dg run --local examples/dhis2-analytics-to-csv-report.yaml
#   dg run --local examples/dhis2-analytics-to-csv-report.yaml -p period=LAST_4_QUARTERS

format: dirigent/v1
kind: pipeline
code: dhis2-analytics-to-csv-report
name: An analytics grid as a csv report
description: Query DHIS2 analytics, flatten the grid into rows, write a csv to S3, and announce it.

tags: [dhis2, s3, csv, cross-boundary]

requires:
  blocks:
    - dhis2.analytics_query
    - transform.jq
    - storage.write
    - convert.std
    - webhook.post

# The public DHIS2 play server, carried inline so this document runs standalone. An instance
# you own names a connection it holds instead of carrying one.
connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 60s

params:
  type: object
  properties:
    indicators:
      type: string
      # ANC 1 coverage and ANC 3 coverage on the play server. Semicolons are DHIS2's own
      # separator for several items on one dimension, so this stays a single string.
      default: Uvn6LCg7dVU;OdiHJayrsKo
    period:
      type: string
      default: LAST_12_MONTHS
      description: A relative period keyword or an ISO period, as DHIS2's pe dimension takes.
    org_unit:
      type: string
      default: ImspTQPwCqd
    bucket:
      type: string
      default: dirigent-reports
    notify_url:
      type: string
      default: https://postman-echo.com/post
      description: Where the summary is posted; the default reflects it back for inspection.

steps:
  query:
    block: dhis2.analytics_query
    config:
      connection: dhis2-demo
      mode: aggregate
      # dimension axes are what the grid is broken down by; filter axes fix a dimension the
      # grid is not broken down by. Putting ou in filter is what makes the report two columns
      # wide instead of three.
      dimension:
        - dx:${params.indicators}
        - pe:${params.period}
      filter:
        - ou:${params.org_unit}
      # UID keeps the grid's own cells as uids and the display names in metaData, which the
      # next step resolves. Asking DHIS2 for NAME here would flatten the report but lose the
      # uid, and a report a machine reads again wants both.
      output_id_scheme: UID

  rows:
    block: transform.jq
    depends_on: [query]
    config:
      input: ${steps.query.output.body}
      # The grid is positional, so the column positions are looked up by header name rather
      # than hard-coded: DHIS2 has moved them between versions. metaData.items maps every uid
      # in the answer to its display name, which is what turns dx:Uvn6LCg7dVU into a label.
      program: |
        . as $grid
        | ([$grid.headers[].name] | index("dx")) as $dx
        | ([$grid.headers[].name] | index("pe")) as $pe
        | ([$grid.headers[].name] | index("value")) as $value
        | $grid.metaData.items as $names
        | [ $grid.rows[]
          | {
              indicator: ($names[.[$dx]].name // .[$dx]),
              period: ($names[.[$pe]].name // .[$pe]),
              value: .[$value]
            }
          ]

  staged:
    block: storage.write
    depends_on: [rows]
    config:
      # The run's own scratch space: these bytes exist only so the converter has a URI to
      # read, and the report the caller keeps is the csv below.
      target: ${run.scratch}/analytics/${params.period}.json
      value: ${steps.rows.output.value}

  report:
    block: convert.std
    depends_on: [staged]
    config:
      source: ${steps.staged.output.uri}
      from: json
      to: csv
      # The object outlives the run, which is the whole point of writing to s3:// rather than
      # ${run.scratch}: a person fetches this after the run is long finished.
      target: s3://${params.bucket}/dhis2/analytics/${params.period}.csv

  summary:
    block: transform.jq
    depends_on: [report]
    config:
      input:
        rows: ${steps.rows.output.value}
        csv: ${steps.report.output.target}
        bytes: ${steps.report.output.bytes_written}
      # Counting happens here rather than in the notification because a webhook body should be
      # a value that was computed, not four references a receiver has to trust were resolved.
      program: |
        {report: .csv, report_bytes: .bytes, row_count: (.rows | length)}

  notify:
    block: webhook.post
    depends_on: [summary]
    retry:
      max_attempts: 3
      backoff: 30s
    config:
      url: ${params.notify_url}
      body: ${steps.summary.output.value}
      # A receiver that queues the notification answers 202, which is delivered as far as this
      # step is concerned: posting it is what the step is responsible for.
      success_status: [200, 201, 202]
