name: release

# A `v*` tag publishes this distribution to PyPI: the plugin and its cross-boundary shelves.
#
# PyPI auth is trusted publishing, so no token is stored here: PyPI verifies the OIDC token
# GitHub mints for this workflow file and environment.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$version" != "$tag" ]; then
            echo "pyproject.toml carries $version, tag says $tag"
            exit 1
          fi

      # Between releases every dependency resolves main from git; a published release
      # requires each dirigent package, and the pack, at exactly the tagged version.
      - name: Pin every dependency at the tagged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          start = text.index("dependencies = [")
          end = text.index("\n]", start)
          block = re.sub(r'"(dirigent-[a-z0-9-]+(?:\[[a-z0-9,]+\])?)"', rf'"\1=={tag}"', text[start:end])
          path.write_text(text[:start] + block + text[end:])
          PY
          sed -n '/^dependencies = \[/,/^\]/p' pyproject.toml

      - name: Build the wheel and sdist
        run: uv build --no-sources --out-dir dist

      - name: Refuse a wheel without the shelves or with a loose pin
        run: |
          set -euo pipefail
          unzip -l dist/*.whl | grep -q 'dirigent_integration/shelves/'
          if unzip -p dist/*.whl '*/METADATA' | grep '^Requires-Dist: dirigent-' | grep -v "==${GITHUB_REF_NAME#v}"; then
            echo "a dependency is not pinned at the tag"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi-dirigent-integration
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
