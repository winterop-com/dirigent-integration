# Assemble the ecosystem and run everyone together: the packs' own tests and examples, the
# cross-boundary examples, and the integration's own tests -- one green or red.
name: integration

on:
  # The assembled check is expensive -- clone every pack, install the whole runtime, run every
  # suite -- so it is deliberately infrequent. Per-commit safety is each repo's own CI; this
  # one is the integration truth, caught once a day and on demand. It never triggers on push.
  schedule:
    # Nightly, so a green ecosystem yesterday is re-proven against today's branch tips.
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Optional, opt-in: a component repo may dispatch this on a release or tag (never per push),
  # to re-prove the ecosystem at a version boundary. No component repo sends it today.
  repository_dispatch:
    types: [component-released]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Assemble the runtime
        run: uv sync

      - name: Types (mypy)
        run: uv run mypy scripts tests

      - name: Run the whole ecosystem
        run: uv run python scripts/run_integration.py

      # The lock this run resolved and tested is the one the image is built from.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

  # A green nightly or dispatched run on main publishes the assembled image as `nightly` and
  # as the UTC date, built on a path context that holds the lock the integration job resolved.
  image:
    name: publish the nightly image
    needs: integration
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # `packages: write` pushes the image, and reads the @winterop-com UI packages in the build.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: uv-lock

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/winterop-com/dirigent-integration
          flavor: latest=false
          tags: |
            type=raw,value=nightly
            type=raw,value={{date 'YYYY-MM-DD' tz='UTC'}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile's `github_token` secret, which installs the @winterop-com UI packages.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Name what was published
        run: |
          echo "ghcr.io/winterop-com/dirigent-integration@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
